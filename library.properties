name=VectiLicense
version=1.0.0
author=VectiVolt <team@vectivolt.com>
maintainer=VectiVolt <team@vectivolt.com>
sentence=Offline device licensing. The device verifies; only you can mint.
paragraph=A licence is an Ed25519 signature over a 36-byte payload bound to the device's own hardware fingerprint, delivered as 160 base32 characters by QR, paste or file. Verification is local: no network, ever. The firmware embeds only the 32-byte public key, so dumping it yields no keygen — unlike a shared-secret scheme, an attacker cannot mint a licence for their own device, add feature bits, or extend an expiry. What it cannot stop is someone who reflashes the device and patches out the check; that is true of every software licensing scheme, and Secure Boot v2 plus Flash Encryption is the only real mitigation. Pure C99 core with no dependencies, one struct of HAL callbacks, and optional bridges for VectiNet (activate through the captive portal, no internet), VectiDash, VectiSerial and VectiOTA.
