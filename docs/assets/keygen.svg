<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" role="img" aria-label="Symmetric licensing embeds the minting key in every firmware image, so one flash dump forges licences for the whole fleet. Asymmetric licensing ships only a public key, so a dump yields nothing.">
  <title>Why VectiLicense is asymmetric</title>
  <defs>
    <marker id="kgArr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#c62f38"/></marker>
    <marker id="kgArrOk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7e968a"/></marker>
  </defs>
  <!-- In-box labels carry textLength sized to their NATURAL advance, capped to the
       box. GitHub serves an SVG as an image where font-family="system-ui" does not
       resolve; the wider fallback overflowed a metrics-dependent layout. Fixing the
       advance removes the dependency without stretching short strings. -->
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
    
<text x="30" y="34" font-size="17" fill="#c62f38" font-weight="700">Symmetric (the design this replaces)</text>    <rect x="30" y="52" width="450" height="258" rx="14" fill="none" stroke="#e0959b" stroke-width="1.6"/>    <rect x="56" y="80" width="178" height="54" rx="9" fill="none" stroke="#e0959b"/>    <text x="145.0" y="103" text-anchor="middle" font-size="13" fill="#55665e" textLength="74.4" lengthAdjust="spacingAndGlyphs">vendor salt</text>    <text x="145.0" y="121" text-anchor="middle" font-size="11.5" fill="#c62f38" textLength="107.6" lengthAdjust="spacingAndGlyphs">mints AND verifies</text>    <rect x="276" y="80" width="178" height="54" rx="9" fill="none" stroke="#e0959b"/>    <text x="365.0" y="103" text-anchor="middle" font-size="13" fill="#55665e" textLength="135.2" lengthAdjust="spacingAndGlyphs">every firmware image</text>    <text x="365.0" y="121" text-anchor="middle" font-size="11.5" fill="#c62f38" textLength="77.7" lengthAdjust="spacingAndGlyphs">salt embedded</text>    <rect x="276" y="182" width="178" height="50" rx="9" fill="none" stroke="#e0959b"/>    <text x="365.0" y="205" text-anchor="middle" font-size="13" fill="#55665e" textLength="121.7" lengthAdjust="spacingAndGlyphs">esptool read_flash</text>    <text x="365.0" y="223" text-anchor="middle" font-size="11.5" fill="#c62f38" textLength="83.7" lengthAdjust="spacingAndGlyphs">salt extracted</text>    <rect x="56" y="182" width="178" height="50" rx="9" fill="#c62f38" fill-opacity="0.12" stroke="#e0959b"/>    <text x="145.0" y="205" text-anchor="middle" font-size="13" fill="#c62f38" font-weight="700" textLength="46.8" lengthAdjust="spacingAndGlyphs">KEYGEN</text>    <text x="145.0" y="223" text-anchor="middle" font-size="11.5" fill="#c62f38" textLength="65.8" lengthAdjust="spacingAndGlyphs">whole fleet</text>    <path d="M234 107 H270" stroke="#c62f38" stroke-width="2" marker-end="url(#kgArr)"/>    <path d="M365 134 V176" stroke="#c62f38" stroke-width="2" marker-end="url(#kgArr)"/>    <path d="M276 207 H240" stroke="#c62f38" stroke-width="2" marker-end="url(#kgArr)"/>    <text x="56" y="266" font-size="12.5" fill="#7e968a">One dumped device forges licences for every</text>    <text x="56" y="285" font-size="12.5" fill="#7e968a">device you ship. Obfuscation cannot fix it.</text>    <text x="520" y="34" font-size="17" fill="#0fd08c" font-weight="700">Asymmetric (VectiLicense)</text>    <rect x="520" y="52" width="450" height="258" rx="14" fill="none" stroke="#5cc9a6" stroke-width="1.6"/>    <rect x="546" y="80" width="178" height="54" rx="9" fill="none" stroke="#5cc9a6"/>    <text x="635.0" y="103" text-anchor="middle" font-size="13" fill="#55665e" textLength="74.4" lengthAdjust="spacingAndGlyphs">private key</text>    <text x="635.0" y="121" text-anchor="middle" font-size="11.5" fill="#0fd08c" textLength="83.7" lengthAdjust="spacingAndGlyphs">stays with you</text>    <rect x="766" y="80" width="178" height="54" rx="9" fill="none" stroke="#5cc9a6"/>    <text x="855.0" y="103" text-anchor="middle" font-size="13" fill="#55665e" textLength="135.2" lengthAdjust="spacingAndGlyphs">every firmware image</text>    <text x="855.0" y="121" text-anchor="middle" font-size="11.5" fill="#0fd08c" textLength="89.7" lengthAdjust="spacingAndGlyphs">public key only</text>    <rect x="766" y="182" width="178" height="50" rx="9" fill="none" stroke="#5cc9a6"/>    <text x="855.0" y="205" text-anchor="middle" font-size="13" fill="#55665e" textLength="121.7" lengthAdjust="spacingAndGlyphs">esptool read_flash</text>    <text x="855.0" y="223" text-anchor="middle" font-size="11.5" fill="#0fd08c" textLength="113.6" lengthAdjust="spacingAndGlyphs">yields a public key</text>    <rect x="546" y="182" width="178" height="50" rx="9" fill="none" stroke="#5cc9a6" stroke-dasharray="5 4"/>    <text x="635.0" y="205" text-anchor="middle" font-size="13" fill="#55665e" textLength="47.3" lengthAdjust="spacingAndGlyphs">nothing</text>    <text x="635.0" y="223" text-anchor="middle" font-size="11.5" fill="#0fd08c" textLength="65.8" lengthAdjust="spacingAndGlyphs">cannot mint</text>    <path d="M724 107 H760" stroke="#7e968a" stroke-width="2" marker-end="url(#kgArrOk)"/>    <path d="M855 134 V176" stroke="#7e968a" stroke-width="2" marker-end="url(#kgArrOk)"/>    <path d="M766 207 H730" stroke="#7e968a" stroke-width="2" marker-end="url(#kgArrOk)"/>    <text x="546" y="266" font-size="12.5" fill="#7e968a">A dumped device yields a key that verifies</text>    <text x="546" y="285" font-size="12.5" fill="#7e968a">and signs nothing. Patching still defeats it.</text>
  </g>
</svg>
